# Прод: один backend+frontend, nginx с HTTPS, SQLite на volume
# Запуск: docker compose -f docker-compose.prod.yml up -d --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_TG_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
        VITE_SUPPORT_URL: ${SUPPORT_URL:-https://t.me/Naval_pay_manager}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_ASSET_ORIGIN: ${VITE_ASSET_ORIGIN:-}
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      BACKEND_PORT: 4000
      DATABASE_URL: file:/data/naval.db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      TELEGRAM_WEBAPP_URL: ${TELEGRAM_WEBAPP_URL}
      SUPPORT_URL: ${SUPPORT_URL:-https://t.me/Naval_pay_manager}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_BOT_POLLING: ${TELEGRAM_BOT_POLLING:-false}
      # Прокси-релей для api.telegram.org (если провайдер его блокирует).
      TELEGRAM_API_ROOT: ${TELEGRAM_API_ROOT:-https://api.telegram.org}
      CORS_ORIGINS: ${CORS_ORIGINS}
      PLATFORM_RAKE_PERCENT: ${PLATFORM_RAKE_PERCENT:-5}
      MIN_WAGER: ${MIN_WAGER:-100}
      # 0 = без фиксированного лимита: ставка ограничена балансом игрока (потолок 1 000 000).
      # Захардкожено литералом, чтобы устаревший серверный .env (MAX_WAGER=10000) НЕ перебивал.
      MAX_WAGER: "0"
      PLACEMENT_TIMEOUT_SEC: ${PLACEMENT_TIMEOUT_SEC:-60}
      TURN_TIMEOUT_SEC: ${TURN_TIMEOUT_SEC:-20}
      MIN_WITHDRAW: ${MIN_WITHDRAW:-1000}
      MAX_WITHDRAW: ${MAX_WITHDRAW:-0}
      MIN_DEPOSIT: ${MIN_DEPOSIT:-0}
      WITHDRAW_FEE_PERCENT: ${WITHDRAW_FEE_PERCENT:-0}
      WITHDRAW_DAILY_LIMIT: ${WITHDRAW_DAILY_LIMIT:-50000}
      INITDATA_MAX_AGE_SEC: ${INITDATA_MAX_AGE_SEC:-3600}
      MM_FLEX_WAIT_SEC: ${MM_FLEX_WAIT_SEC:-30}
      MM_FLEX_PCT: ${MM_FLEX_PCT:-0.1}
      AFK_FORFEIT_TIMEOUTS: ${AFK_FORFEIT_TIMEOUTS:-2}
      AFK_MATCH_MAX_TIMEOUTS: ${AFK_MATCH_MAX_TIMEOUTS:-6}
      # Crypto Pay (@CryptoBot) — обязателен для пополнения
      CRYPTO_PAY_TOKEN: ${CRYPTO_PAY_TOKEN:-}
      CRYPTO_PAY_API: ${CRYPTO_PAY_API:-https://pay.crypt.bot/api}
      # Ключ для админских действий (обработка выводов)
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      ADMIN_PANEL_PATH: ${ADMIN_PANEL_PATH:-harbor-9k2-mnx-panel}
      ADMIN_PANEL_USER: ${ADMIN_PANEL_USER:-}
      ADMIN_PANEL_PASSWORD: ${ADMIN_PANEL_PASSWORD:-}
      ADMIN_PANEL_IPS: ${ADMIN_PANEL_IPS:-}
      # Telegram ID админа — уведомления в личку игрового бота
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID:-}
      ADMIN_ALERT_ENABLED: ${ADMIN_ALERT_ENABLED:-true}
      # Серия входов (достижения, без денег)
      DAILY_BONUS_MAX_STREAK: ${DAILY_BONUS_MAX_STREAK:-7}
      # Боты-соперники (пока мало живых игроков).
      # Значения захардкожены литералами, чтобы устаревший серверный .env
      # (где было BOTS_COUNT=1 / BOT_OPEN_LOBBIES=1) их НЕ перебивал.
      BOTS_ENABLED: "true"
      BOTS_COUNT: "31"
      BOT_WIN_RATE: "0.6"
      BOT_MATCH_WAIT_SEC: ${BOT_MATCH_WAIT_SEC:-10}
      BOT_OPEN_LOBBIES: "8"
      BOT_MIN_DELAY_MS: "400"
      BOT_MAX_DELAY_MS: "9000"
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      # Sentry (мониторинг ошибок, опционально)
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      APP_RELEASE: ${GIT_SHA:-}
      LEADERBOARD_HIDDEN_USERS: ${LEADERBOARD_HIDDEN_USERS:-}
    volumes:
      - naval-data:/data
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4000/health || exit 1"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 90s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    expose:
      - "6379"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/nginx.sslip-assets.conf:/etc/nginx/sslip-assets.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./certbot-www:/var/www/certbot:ro

volumes:
  naval-data:
