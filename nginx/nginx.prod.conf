user nginx;
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json text/css application/javascript image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # Docker embedded DNS — перерезолвить app после каждого redeploy контейнера
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # game.navalclash.ru за Cloudflare режет JS. Редирект на sslip через HTML+JS (302 теряет #tgWebAppData в TG).
    map $host $use_sslip_redirect {
        game.navalclash.ru 1;
        default 0;
    }

    # ACME + HTTP → HTTPS
    server {
        listen 80;
        server_name 176-12-68-39.sslip.io;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        # Без http2: у части связок CF↔origin обрывается тело при большом Content-Length.
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2;

        client_max_body_size 2m;

        location /assets/ {
            gzip off;
            gzip_static on;
            # Origin: только identity + .js.gz с верным Content-Length (posthog-js#1906, CF compression docs).
            proxy_set_header Accept-Encoding "";
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Cache-Control "public, max-age=604800, no-transform" always;
            set $backend http://app:4000;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location = / {
            if ($use_sslip_redirect) {
                add_header Content-Type "text/html; charset=utf-8" always;
                add_header Cache-Control "no-store" always;
                return 200 '<!doctype html><meta charset="utf-8"><script>location.replace("https://176-12-68-39.sslip.io"+location.pathname+location.search+location.hash);</script>';
            }
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            set $backend http://app:4000;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            limit_req zone=api burst=60 nodelay;
            set $backend http://app:4000;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
        }
    }

    # После основного vhost — иначе sslip становится default_server и / на game отдаёт 404.
    include /etc/nginx/sslip-assets.conf;
}
