user nginx;
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json text/css application/javascript image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # Docker embedded DNS
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl default_server;
        server_name navalclash.xyz;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        client_max_body_size 2m;

        # Заглушка при рестарте бэкенда — автообновление каждые 3с
        location @offline {
            add_header Content-Type "text/html; charset=utf-8" always;
            add_header Cache-Control "no-store" always;
            return 200 '<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Морской Бой</title><style>html,body{height:100%;margin:0}body{display:flex;align-items:center;justify-content:center;background:#EAE6D7;color:#2b2b2b;font-family:-apple-system,sans-serif}.b{text-align:center}.s{width:42px;height:42px;border:4px solid #d8d2bd;border-top-color:#E1574B;border-radius:50%;margin:0 auto 16px;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}</style></head><body><div class="b"><div class="s"></div><div>Запускаем Морской Бой…</div></div><script>setTimeout(function(){location.reload()},3000)</script></body></html>';
        }

        location = / {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            set $backend http://app:4000;
            proxy_intercept_errors on;
            error_page 502 503 504 = @offline;
            proxy_connect_timeout 3s;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Telegram-Init-Data $http_x_telegram_init_data;
        }

        location / {
            limit_req zone=api burst=60 nodelay;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            set $backend http://app:4000;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Telegram-Init-Data $http_x_telegram_init_data;
            proxy_read_timeout 86400;
        }
    }

    include /etc/nginx/sslip-assets.conf;
}
