    # Полный сайт без Cloudflare — для браузера: https://176-12-68-39.sslip.io
    server {
        listen 443 ssl;
        server_name 176-12-68-39.sslip.io;

        ssl_certificate     /etc/nginx/certs/sslip-fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/sslip-privkey.pem;
        ssl_protocols       TLSv1.2;

        client_max_body_size 2m;

        location /assets/ {
            gzip off;
            gzip_static on;
            proxy_set_header Accept-Encoding "";
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Cache-Control "public, max-age=604800, no-transform" always;
            set $backend http://app:4000;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host 176-12-68-39.sslip.io;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        location = / {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            set $backend http://app:4000;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host 176-12-68-39.sslip.io;
        }

        location / {
            limit_req zone=api burst=60 nodelay;
            set $backend http://app:4000;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host 176-12-68-39.sslip.io;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
        }
    }
