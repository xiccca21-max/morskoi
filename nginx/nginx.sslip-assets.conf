    # Прямой доступ без Cloudflare — URL бота: https://185-246-217-2.sslip.io
    # КРИТИЧНО: server_name ДОЛЖЕН совпадать с TELEGRAM_WEBAPP_URL и Let's Encrypt cert.
    server {
        listen 443 ssl;
        server_name 185-246-217-2.sslip.io;

        ssl_certificate     /etc/nginx/certs/sslip-fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/sslip-privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        client_max_body_size 2m;

        location /assets/ {
            gzip off;
            gzip_static on;
            proxy_set_header Accept-Encoding "";
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Cache-Control "public, max-age=604800, no-transform" always;
            set $backend http://app:4000;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host 185-246-217-2.sslip.io;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        location = / {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            set $backend http://app:4000;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host 185-246-217-2.sslip.io;
            proxy_set_header X-Telegram-Init-Data $http_x_telegram_init_data;
        }

        location / {
            limit_req zone=api burst=60 nodelay;
            set $backend http://app:4000;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host 185-246-217-2.sslip.io;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Telegram-Init-Data $http_x_telegram_init_data;
            proxy_read_timeout 86400;
        }
    }
