# Автодеплой на VPS при каждом push в main.
# Secrets нужно добавить один раз в GitHub → Settings → Secrets and variables → Actions:
#   DEPLOY_HOST     — IP или домен VPS (например 1.2.3.4)
#   DEPLOY_USER     — SSH-пользователь (например root)
#   DEPLOY_KEY      — приватный SSH-ключ (содержимое ~/.ssh/id_rsa с VPS)
#   DEPLOY_PATH     — путь к проекту на VPS (например /opt/naval-clash)

name: 🚀 Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            chmod +x scripts/deploy.sh
            bash scripts/deploy.sh
