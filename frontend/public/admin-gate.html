<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Вход</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --red: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: min(400px, 92vw); background: var(--panel); border: 1px solid var(--border);
      border-radius: 14px; padding: 28px 24px;
    }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    input {
      width: 100%; margin-bottom: 14px; padding: 11px 12px; border-radius: 8px;
      border: 1px solid var(--border); background: #273449; color: var(--text); font-size: 15px;
    }
    input:focus { outline: none; border-color: var(--accent); }
    button {
      width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 700;
      font-size: 15px; cursor: pointer; background: var(--accent); color: #06283d;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .err { color: var(--red); font-size: 13px; min-height: 18px; margin-top: 10px; }
  </style>
</head>
<body>
  <form class="card" id="form">
    <h1>⚓ Панель управления</h1>
    <p>Введите логин и пароль администратора.</p>
    <label for="user">Логин</label>
    <input id="user" name="username" autocomplete="username" required />
    <label for="pass">Пароль</label>
    <input id="pass" name="password" type="password" autocomplete="current-password" required />
    <button type="submit" id="btn">Войти</button>
    <div class="err" id="err"></div>
  </form>
  <script>
    const form = document.getElementById('form');
    const err = document.getElementById('err');
    const btn = document.getElementById('btn');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      btn.disabled = true;
      try {
        const res = await fetch('/api/admin/panel-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({
            username: document.getElementById('user').value.trim(),
            password: document.getElementById('pass').value,
          }),
        });
        if (!res.ok) {
          let msg = 'Неверный логин или пароль';
          try { const j = await res.json(); if (j.message) msg = Array.isArray(j.message) ? j.message.join(', ') : j.message; } catch {}
          throw new Error(msg);
        }
        window.location.replace(window.location.pathname);
      } catch (ex) {
        err.textContent = ex.message || 'Ошибка входа';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
