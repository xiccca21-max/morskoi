<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Морской Бой — Вход в панель</title>
  <link rel="stylesheet" href="/admin-theme.css" />
</head>
<body>
  <div class="login-page">
    <form class="login-card" id="form">
      <div class="brand-icon" style="margin:0 auto 16px;width:56px;height:56px;font-size:28px;">⚓</div>
      <h1>Штаб адмирала</h1>
      <p class="lead">Только для тебя. Введи логин и пароль — это не то же самое, что ключ API внутри панели.</p>
      <label for="user">Логин</label>
      <input id="user" name="username" autocomplete="username" required placeholder="masinxn" />
      <label for="pass">Пароль</label>
      <input id="pass" name="password" type="password" autocomplete="current-password" required placeholder="••••••••" />
      <button type="submit" class="btn" id="btn">Войти в панель</button>
      <div class="err" id="err" role="alert"></div>
      <span class="tool-chip">Naval Clash · закрытая зона</span>
    </form>
  </div>
  <script>
    const form = document.getElementById('form');
    const err = document.getElementById('err');
    const btn = document.getElementById('btn');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Входим…';
      try {
        const res = await fetch('/api/admin/panel-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({
            username: document.getElementById('user').value.trim(),
            password: document.getElementById('pass').value,
          }),
        });
        if (!res.ok) {
          let msg = 'Неверный логин или пароль';
          try {
            const j = await res.json();
            if (j.message) msg = Array.isArray(j.message) ? j.message.join(', ') : j.message;
          } catch { /* ignore */ }
          throw new Error(msg);
        }
        window.location.replace(window.location.pathname);
      } catch (ex) {
        err.textContent = ex.message || 'Ошибка входа';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Войти в панель';
      }
    });
  </script>
</body>
</html>
