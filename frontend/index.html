<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#EAE6D7" />
    <meta name="description" content="Морской Бой — PvP-дуэль капитанов на ставку прямо в Telegram." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Морской Бой" />
    <meta property="og:title" content="Морской Бой · Дуэль капитанов" />
    <meta property="og:description" content="PvP-дуэль на ставку прямо в Telegram." />
    <meta property="og:type" content="website" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function () {
        try {
          var h = location.hash.slice(1);
          if (h && h.indexOf('tgWebAppData=') !== -1) {
            var p = new URLSearchParams(h);
            var d = p.get('tgWebAppData');
            if (d) sessionStorage.setItem('tg_init_data', d);
          }
          var q = new URLSearchParams(location.search);
          var qd = q.get('tgWebAppData');
          if (qd) sessionStorage.setItem('tg_init_data', qd);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Морской Бой · Дуэль капитанов</title>
    <style>
      html, body { margin: 0; background-color: #EAE6D7; }
      .boot {
        display: flex; height: 100vh; align-items: center; justify-content: center; flex-direction: column; gap: 12px;
        background-color: #EAE6D7; color: #000000; font-family: 'Oswald', Impact, sans-serif;
      }
      .boot .name { font-size: 30px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 700; }
      .boot .sub { font-size: 12px; letter-spacing: 0.26em; color: #444444; text-transform: uppercase; font-weight: 500; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="name">Морской&nbsp;Бой</div>
        <div class="sub">Загрузка</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
