<!doctype html>
<html lang="ru" data-theme="brutal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#EAE6D7" />
    <meta name="description" content="Морской Бой — PvP-дуэль капитанов на ставку прямо в Telegram." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Морской Бой" />
    <meta property="og:title" content="Морской Бой · Дуэль капитанов" />
    <meta property="og:description" content="PvP-дуэль на ставку прямо в Telegram." />
    <meta property="og:type" content="website" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function () {
        try {
          var h = location.hash.slice(1);
          if (h && h.indexOf('tgWebAppData=') !== -1) {
            var p = new URLSearchParams(h);
            var d = p.get('tgWebAppData');
            if (d) sessionStorage.setItem('tg_init_data', d);
          }
          var q = new URLSearchParams(location.search);
          var qd = q.get('tgWebAppData');
          if (qd) sessionStorage.setItem('tg_init_data', qd);
        } catch (e) {}
        function signalReady() {
          try {
            var tg = window.Telegram && window.Telegram.WebApp;
            if (!tg) return false;
            tg.ready();
            tg.expand();
            return true;
          } catch (e) {
            return false;
          }
        }
        signalReady();
        var n = 0;
        var iv = setInterval(function () {
          if (signalReady() || ++n > 40) clearInterval(iv);
        }, 100);
      })();
    </script>
    <title>Морской Бой · Дуэль капитанов</title>
    <style>
      html, body { margin: 0; background-color: #EAE6D7; }
      .boot {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        text-align: center;
        background-color: #EAE6D7;
      }
      .boot__title {
        font-family: 'Oswald', Impact, sans-serif;
        font-size: 30px;
        letter-spacing: 0.2em;
        font-weight: 700;
        color: #000000;
        text-transform: uppercase;
        margin: 0;
      }
      .boot__sub {
        font-family: 'Oswald', Impact, sans-serif;
        font-size: 12px;
        letter-spacing: 0.26em;
        font-weight: 500;
        color: #444444;
        text-transform: uppercase;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <h1 class="boot__title">Морской&nbsp;Бой</h1>
        <p class="boot__sub">Загрузка</p>
      </div>
    </div>
    <script>
      (function () {
        // После деплоя у клиента может остаться старый index.html, ссылающийся на
        // чанки с устаревшими хэшами (их уже нет на сервере → 404). Вместо «битого»
        // экрана с текстом ошибки молча перезагружаемся один раз, чтобы получить
        // свежий index.html и новые чанки. Защита от зацикливания — не чаще раза в 15с.
        var RELOAD_KEY = 'chunkReloadAt';
        function recoverFromStaleChunk() {
          try {
            var now = Date.now();
            var last = parseInt(sessionStorage.getItem(RELOAD_KEY) || '0', 10);
            if (now - last > 15000) {
              sessionStorage.setItem(RELOAD_KEY, String(now));
              location.reload();
              return;
            }
          } catch (err) {}
          // Перезагрузка уже была и не помогла — дружелюбный экран с кнопкой.
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML =
            '<div class="boot">' +
            '<h1 class="boot__title">Морской&nbsp;Бой</h1>' +
            '<p class="boot__sub">Обновляем игру…</p>' +
            '<button type="button" onclick="location.reload()" style="margin-top:10px;font-family:Oswald,Impact,sans-serif;text-transform:uppercase;letter-spacing:0.12em;font-weight:700;font-size:13px;padding:11px 26px;border:2px solid #000;background:#E1574B;color:#fff;border-radius:10px;cursor:pointer">Перезагрузить</button>' +
            '</div>';
        }
        // Сбой загрузки нашего <script> из /assets/ (внешние скрипты вроде telegram.org не трогаем).
        window.addEventListener(
          'error',
          function (e) {
            var t = e.target;
            if (!t || t.tagName !== 'SCRIPT') return;
            if ((t.src || '').indexOf('/assets/') === -1) return;
            recoverFromStaleChunk();
          },
          true,
        );
        // Провал динамического import() (React.lazy) — тоже признак устаревших чанков.
        window.addEventListener('unhandledrejection', function (e) {
          var msg = (e && e.reason && (e.reason.message || e.reason)) + '';
          if (/dynamically imported module|importing a module script|Failed to fetch|Loading chunk|error loading/i.test(msg)) {
            recoverFromStaleChunk();
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
