<!doctype html>
<html lang="ru" data-theme="brutal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#EAE6D7" />
    <meta name="description" content="Морской Бой — PvP-дуэль капитанов на ставку прямо в Telegram." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Морской Бой" />
    <meta property="og:title" content="Морской Бой · Дуэль капитанов" />
    <meta property="og:description" content="PvP-дуэль на ставку прямо в Telegram." />
    <meta property="og:type" content="website" />
    <script>
      /* iOS Telegram WebView: клиент вызывает receiveEvent до загрузки бандла */
      window.TelegramGameProxy = window.TelegramGameProxy || { receiveEvent: function () {} };
      /* iOS 15.x: Object.hasOwn отсутствует — ломает часть полифиллов */
      if (!Object.hasOwn) {
        Object.hasOwn = function (o, p) { return Object.prototype.hasOwnProperty.call(o, p); };
      }
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function () {
        try {
          var h = location.hash.slice(1);
          if (h && h.indexOf('tgWebAppData=') !== -1) {
            var p = new URLSearchParams(h);
            var d = p.get('tgWebAppData');
            if (d) {
              sessionStorage.setItem('tg_init_data', d);
              try { localStorage.setItem('tg_init_data', d); } catch (e2) {}
            }
          }
          var q = new URLSearchParams(location.search);
          var qd = q.get('tgWebAppData');
          if (qd) {
            sessionStorage.setItem('tg_init_data', qd);
            try { localStorage.setItem('tg_init_data', qd); } catch (e2) {}
          }
        } catch (e) {}
        function signalReady() {
          try {
            var tg = window.Telegram && window.Telegram.WebApp;
            if (!tg) return false;
            tg.ready();
            tg.expand();
            return true;
          } catch (e) {
            return false;
          }
        }
        signalReady();
        var n = 0;
        var iv = setInterval(function () {
          if (signalReady() || ++n > 40) clearInterval(iv);
        }, 100);
      })();
    </script>
    <title>Морской Бой · Дуэль капитанов</title>
    <style>
      html, body { margin: 0; background-color: #EAE6D7; }
      .boot {
        position: relative;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        text-align: center;
        background-color: #EAE6D7;
        overflow: hidden;
      }
      .boot__hatch {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.05;
        background-image: repeating-linear-gradient(45deg, #000 0, #000 1px, transparent 0, transparent 12px);
      }
      .boot__wheel {
        position: relative;
        width: 92px;
        height: 92px;
        overflow: visible;
        transform-origin: 50% 50%;
        animation: bootSpin 9s linear infinite;
      }
      @keyframes bootSpin { to { transform: rotate(360deg); } }
      .boot__head {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .boot__accent { width: 56px; height: 3px; background: #E1574B; border-radius: 2px; }
      .boot__bar {
        position: relative;
        width: 150px;
        height: 3px;
        border-radius: 3px;
        background: rgba(0, 0, 0, 0.12);
        overflow: hidden;
      }
      .boot__bar > i {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 40%;
        background: #E1574B;
        border-radius: 3px;
        animation: bootLoad 1.5s ease-in-out infinite;
      }
      @keyframes bootLoad {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(330%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot__wheel, .boot__bar > i { animation: none; }
      }
      .boot__title {
        font-family: 'Oswald', Impact, sans-serif;
        font-size: 30px;
        letter-spacing: 0.2em;
        font-weight: 700;
        color: #000000;
        text-transform: uppercase;
        margin: 0;
      }
      .boot__sub {
        font-family: 'Oswald', Impact, sans-serif;
        font-size: 12px;
        letter-spacing: 0.26em;
        font-weight: 500;
        color: #6b655a;
        text-transform: uppercase;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="boot__hatch"></div>
        <svg class="boot__wheel" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="31" fill="none" stroke="#15110E" stroke-width="5" />
          <g stroke="#15110E" stroke-width="4" stroke-linecap="round">
            <line x1="59" y1="50" x2="94" y2="50" />
            <line x1="56.36" y1="56.36" x2="81.11" y2="81.11" />
            <line x1="50" y1="59" x2="50" y2="94" />
            <line x1="43.64" y1="56.36" x2="18.89" y2="81.11" />
            <line x1="41" y1="50" x2="6" y2="50" />
            <line x1="43.64" y1="43.64" x2="18.89" y2="18.89" />
            <line x1="50" y1="41" x2="50" y2="6" />
            <line x1="56.36" y1="43.64" x2="81.11" y2="18.89" />
          </g>
          <g fill="#15110E">
            <circle cx="94" cy="50" r="3.4" />
            <circle cx="81.11" cy="81.11" r="3.4" />
            <circle cx="50" cy="94" r="3.4" />
            <circle cx="18.89" cy="81.11" r="3.4" />
            <circle cx="6" cy="50" r="3.4" />
            <circle cx="18.89" cy="18.89" r="3.4" />
            <circle cx="50" cy="6" r="3.4" />
            <circle cx="81.11" cy="18.89" r="3.4" />
          </g>
          <circle cx="50" cy="50" r="9" fill="#15110E" />
          <circle cx="50" cy="50" r="3.6" fill="#E1574B" />
        </svg>
        <div class="boot__head">
          <h1 class="boot__title">Морской&nbsp;Бой</h1>
          <span class="boot__accent"></span>
          <p class="boot__sub">Загрузка</p>
        </div>
        <div class="boot__bar"><i></i></div>
      </div>
    </div>
    <script>
      (function () {
        // После деплоя у клиента может остаться старый index.html, ссылающийся на
        // чанки с устаревшими хэшами (их уже нет на сервере → 404). Вместо «битого»
        // экрана с текстом ошибки молча перезагружаемся один раз, чтобы получить
        // свежий index.html и новые чанки. Защита от зацикливания — не чаще раза в 15с.
        var RELOAD_KEY = 'chunkReloadAt';
        var BOOT_GRACE_MS = 8000;
        var bootStartedAt = Date.now();
        function recoverFromStaleChunk() {
          try {
            if (Date.now() - bootStartedAt < BOOT_GRACE_MS) return;
            var now = Date.now();
            var last = parseInt(sessionStorage.getItem(RELOAD_KEY) || '0', 10);
            if (now - last > 30000) {
              sessionStorage.setItem(RELOAD_KEY, String(now));
              var base = location.pathname + location.search;
              var sep = base.indexOf('?') >= 0 ? '&' : '?';
              location.replace(base + sep + '_=' + now + location.hash);
              return;
            }
          } catch (err) {}
          // Перезагрузка уже была и не помогла — дружелюбный экран с кнопкой.
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML =
            '<div class="boot">' +
            '<h1 class="boot__title">Морской&nbsp;Бой</h1>' +
            '<p class="boot__sub">Обновляем игру…</p>' +
            '<button type="button" onclick="location.reload()" style="margin-top:10px;font-family:Oswald,Impact,sans-serif;text-transform:uppercase;letter-spacing:0.12em;font-weight:700;font-size:13px;padding:11px 26px;border:2px solid #000;background:#E1574B;color:#fff;border-radius:10px;cursor:pointer">Перезагрузить</button>' +
            '</div>';
        }
        // Сбой загрузки нашего <script> из /assets/ (внешние скрипты вроде telegram.org не трогаем).
        window.addEventListener(
          'error',
          function (e) {
            var t = e.target;
            if (!t || t.tagName !== 'SCRIPT') return;
            if ((t.src || '').indexOf('/assets/') === -1) return;
            recoverFromStaleChunk();
          },
          true,
        );
        // Провал динамического import() (React.lazy) — тоже признак устаревших чанков.
        window.addEventListener('unhandledrejection', function (e) {
          var msg = (e && e.reason && (e.reason.message || e.reason)) + '';
          if (/dynamically imported module|importing a module script|Failed to fetch|Loading chunk|error loading/i.test(msg)) {
            recoverFromStaleChunk();
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
