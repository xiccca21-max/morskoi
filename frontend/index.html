<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#050a14" />
    <meta name="description" content="Морской Бой — PvP-дуэль капитанов на ставку прямо в Telegram." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Морской Бой" />
    <meta property="og:title" content="Морской Бой · Дуэль капитанов" />
    <meta property="og:description" content="PvP-дуэль на ставку прямо в Telegram." />
    <meta property="og:type" content="website" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function () {
        try {
          var h = location.hash.slice(1);
          if (h && h.indexOf('tgWebAppData=') !== -1) {
            var p = new URLSearchParams(h);
            var d = p.get('tgWebAppData');
            if (d) sessionStorage.setItem('tg_init_data', d);
          }
          var q = new URLSearchParams(location.search);
          var qd = q.get('tgWebAppData');
          if (qd) sessionStorage.setItem('tg_init_data', qd);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Морской Бой · Дуэль капитанов</title>
    <style>
      html, body { margin: 0; background-color: #050a14; }
      .boot {
        display: flex; height: 100vh; align-items: center; justify-content: center; flex-direction: column; gap: 18px;
        color: #dce8ff; font-family: 'Inter', system-ui, sans-serif;
        background:
          radial-gradient(ellipse 90% 60% at 50% 18%, rgba(212,168,44,0.08), transparent 55%),
          radial-gradient(ellipse 80% 60% at 50% 100%, rgba(14,80,190,0.18), transparent 55%),
          linear-gradient(180deg, #081326 0%, #050a14 60%, #03060f 100%);
      }
      .boot .ring {
        position: relative; width: 92px; height: 92px; display: flex; align-items: center; justify-content: center;
      }
      .boot .ring::before, .boot .ring::after {
        content: ''; position: absolute; inset: 0; border-radius: 50%;
        border: 1.5px solid rgba(240,75,65,0.4); animation: ping 2.2s ease-out infinite;
      }
      .boot .ring::after { animation-delay: 1.1s; }
      .boot .mark {
        position: relative; width: 78px; height: 78px; border-radius: 24px;
        background: linear-gradient(150deg, rgba(20,36,72,0.95), rgba(5,10,20,0.95));
        box-shadow: 0 12px 48px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08), 0 0 0 1px rgba(212,168,44,0.2);
        display: flex; align-items: center; justify-content: center; animation: bob 3.2s ease-in-out infinite;
      }
      .boot .name {
        font-size: 22px; letter-spacing: 0.24em; text-transform: uppercase; font-weight: 700;
        font-family: 'Oswald', Impact, sans-serif;
        background: linear-gradient(120deg, #f6dd8e 0%, #e3b94a 48%, #b8860f 100%);
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      }
      .boot .eyebrow { font-size: 9px; letter-spacing: 0.46em; color: rgba(212,168,44,0.85); text-transform: uppercase; font-family: 'Oswald', sans-serif; margin-bottom: -10px; }
      .boot .sub { display: flex; align-items: center; gap: 7px; font-size: 9px; letter-spacing: 0.3em; color: #5f7daf; text-transform: uppercase; }
      .boot .sub .dot { width: 6px; height: 6px; border-radius: 50%; background: #f04b41; animation: pulse 1.2s ease-in-out infinite; }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes ping { 0% { transform: scale(0.7); opacity: 0.6; } 100% { transform: scale(1.6); opacity: 0; } }
      @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="ring">
          <div class="mark">
            <svg width="46" height="46" viewBox="0 0 40 40" fill="none" aria-hidden>
              <circle cx="20" cy="20" r="18.5" stroke="url(#bg)" stroke-width="1.3" fill="none"/>
              <circle cx="20" cy="20" r="15.2" stroke="url(#bg)" stroke-width="0.7" stroke-opacity="0.35" fill="none"/>
              <path d="M20 20 L26 14 L20 20 L26 26 L20 20 L14 26 L20 20 L14 14 Z" fill="url(#bg)" fill-opacity="0.45"/>
              <path d="M20 4.5 L22.4 18 L20 20 L17.6 18 Z" fill="url(#bg)"/>
              <path d="M20 35.5 L22.4 22 L20 20 L17.6 22 Z" fill="url(#bg)"/>
              <path d="M35.5 20 L22 22.4 L20 20 L22 17.6 Z" fill="url(#bg)"/>
              <path d="M4.5 20 L18 22.4 L20 20 L18 17.6 Z" fill="url(#bg)"/>
              <circle cx="20" cy="20" r="2.6" fill="url(#br)"/>
              <circle cx="20" cy="20" r="2.6" stroke="rgba(255,255,255,0.5)" stroke-width="0.6" fill="none"/>
              <defs>
                <linearGradient id="bg" x1="6" y1="6" x2="34" y2="34" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#f6dd8e"/><stop offset="48%" stop-color="#e3b94a"/><stop offset="100%" stop-color="#b8860f"/>
                </linearGradient>
                <radialGradient id="br" cx="0.4" cy="0.35" r="0.8">
                  <stop offset="0%" stop-color="#ff6a5c"/><stop offset="60%" stop-color="#e02b1f"/><stop offset="100%" stop-color="#a01510"/>
                </radialGradient>
              </defs>
            </svg>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
          <div class="eyebrow">Морской</div>
          <div class="name">Бой</div>
        </div>
        <div class="sub"><span class="dot"></span>Подготовка флота</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
